; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.2.2
board_build.filesystem = littlefs
extra_scripts = pre:scripts/patch_framework.py

; TFT_eSPI display config is kept here instead of the library's
; User_Setup_Select.h (which lives in libdeps/ and is wiped on reinstall).
; USER_SETUP_LOADED skips User_Setup_Select.h so the settings below win.
build_flags =
	-D USER_SETUP_LOADED
	-D ST7789_DRIVER
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=-1
	-D TFT_DC=15
	-D TFT_RST=4
	; 62.5 MHz = ST7789 datasheet max. 80 MHz (SPI_FREQUENCY=80000000)
	; often renders nothing on this panel over manual jumper wiring
	; (init succeeds, screen stays black). Try 40 MHz if 62.5 fails too.
	-D SPI_FREQUENCY=62500000
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	; DMA rendering (tft.initDMA + pushImageDMA). Suspected of leaving the
	; panel black on this ESP32/Arduino-SPI combo (it re-initializes the SPI
	; bus). Uncomment to enable; if the screen is black with it enabled keep
	; it off.
	; -D USE_DMA